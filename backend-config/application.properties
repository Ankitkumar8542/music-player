# ── Server ────────────────────────────────────────────────────────────────────
spring.application.name=app
server.port=8080

# ── MySQL Database ─────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/musicplayer?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── CORS (allow frontend at localhost:3000) ───────────────────────────────────
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# ── File Upload ───────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ── JWT Secret (change this to a strong random string) ───────────────────────
jwt.secret=MySecretKeyForMusicPlayerApp1234567890AbCdEfGhIjKlMnOpQrStUvWxYz
jwt.expiration=86400000
